mahlzeit_blog.list:
  path: '/blog'
  defaults:
    _controller: '\Drupal\mahlzeit_blog\Controller\BlogController::listing'
    _title: 'Blog'
  requirements:
    _permission: 'access content'

mahlzeit_blog.category:
  path: '/blog/{category}'
  defaults:
    _controller: '\Drupal\mahlzeit_blog\Controller\BlogController::listing'
    _title: 'Blog'
  requirements:
    _permission: 'access content'
    category: '[a-z0-9][a-z0-9-]*'
