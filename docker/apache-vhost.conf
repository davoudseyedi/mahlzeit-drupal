<VirtualHost *:80>
    ServerName _
    DocumentRoot /var/www/html/web

    <Directory /var/www/html/web>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
